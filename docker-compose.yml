# First run:  docker compose up -d mssql && sh tools/restore-ranchi.sh     (loads the Ranchi demo database)
# Then:       docker compose up --build -d
services:
  mssql:                      # in production this is the school's own SQL Server, not a container
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"   # localhost only, for DB tools and host-run tests
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  api:
    build: .
    env_file: .env
    environment:
      SA_PASSWORD: ""                 # the API never holds the SQL Server admin password
      SCHOOL_DB_HOST: ""              # use the host named in schools.json (`mssql`); .env says localhost for host-run
    ports:
      - "4000:4000"
    depends_on: { mssql: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  school-site:                # DEV ONLY: stand-in for the school's own website (same image, no secrets)
    build: .
    command: ["node", "demo-site/serve.js"]
    # frames the Heroku api (demo-site/serve.js). To frame the local api instead:  PAY_URL=http://localhost:4000
    environment:
      PAY_URL: ${PAY_URL:-}
    ports:
      - "5003:5003"
    restart: unless-stopped

volumes:
  mssqldata:
